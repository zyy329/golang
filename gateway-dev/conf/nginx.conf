worker_processes 1;                 # 工作进程数, 固定值, 更可预期估算
worker_rlimit_nofile    65535;
events {
	worker_connections 10240;       # 每个worker process最大并发连接数
    use epoll;
    multi_accept on;
}

http {
    error_log logs/error.log info;
    access_log logs/access.log;
	#lua_code_cache off;
	resolver 8.8.8.8;       # redis 地址目前使用到了域名, 需指定 DNS 服务

	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	lua_package_path "$prefix../lua/?.lua;;";

	# dyUpsMap 用共享字典
	lua_shared_dict dyUpsMap 10m;

	init_by_lua_block {
	    require("tool").init_by_lua_block()
	}

	init_worker_by_lua_block {
	    require("tool").init_worker_by_lua_block()
	}

	server {
		listen 8080;
		location = / {
		    return 404;
            # 彻底关闭针对该路径的日志，保持错误日志清爽
            access_log off;
            log_not_found off;
		}
		location /game {
			include ./wss_proxy_params;
			set $target '';
			access_by_lua_block {
				ngx.var.target = require("gameRouter").Router()
			}
			# $uri, 用于裁剪掉 URL中的参数部分, 这部分Game服并不需要
			proxy_pass http://$target$uri;
		}
		# 用于/game失败后,客户端再次发起http请求获取错误码(客户端SDK限制,WS请求无法获得http错误码)
		location /game/ack {
			default_type text/html;
			access_by_lua_block {
				require("gameRouter").Router()
				-- 理论上不会走到这一步, 如果走到就返回成功给客户端
				ngx.exit(200)
			}
        }
        location ~ ^/test {
			default_type text/html;
			content_by_lua_block {
			    if openTest then
				    ngx.say(require("gameRouter").Test())
			    else
			        ngx.say("not open test")
			    end
			}
        }

        # 兜底配置：拦截所有未定义路径的 index 查找
        location / {
            return 404;
            log_not_found off;
        }
	}
}

